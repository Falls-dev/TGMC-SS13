author: "Pak2024"
delete-after: True
changes:
  - rscadd: "Ачек и Элес добавлены в мемориал на постоянной основе"
  - rscadd: "В радиусе 10 тайлов от сюрва больше нельзя всё быстро плавить (если ток он не сидит в шкафу, ну это типа для стелса?)"
  - rscadd: "Добавлена возможность через верб менять то, на каком глазу будет повязка eyepatch"
  - rscadd: "Динамичная стоимость сило, за каждое поставленное +150 поинтов. 1 сило - 800, 2 - 950 и т.д"
  - rscadd: "Ковбойские боты и белые получили 2 слота аналогично обычным маровским ботинкам"
  - rscadd: "В меде в химии добавлен автомат крови"
  - rscadd: "Добавлена возможность вставлять КТЛД очки во все очки из униформ вендроа, кроме regulation prescription glasses. Спрайты взяты от имагеров (у роботов красные визоры)"
  - rscadd: "В преф снарягу добавлена гавайка браво, томагавк дельты, а также отрядные водолазки кроме иностранного отряда. Все эти вещи можно взять, только состоя в соответствующем отряде. Тоесть, спавнясь в альфе вы не получите гавайку браво"
  - rscadd: "Добавлен огнемётный рюкзак инжа (тот который с FL-86 огнемётом) за 175 очков в карго, категория униформы"
  - rscadd: "Рюкзаку инжа с огнемётом добавлена возможность менять тип топлива путём опустошения своего через верб и потом пополнения другим типом топлива (вам нужно будет также бак для огнемёта того же типа)"
  - rscadd: "Компактному огнемёту добавил возможность вешать G fuel бак"
  - rscadd: "В карго добавлены мезонки в категорию униформы за 100 очков"
  - balance: "Изменена формула, по которой возможен хиджак: Мары = Ксены/2. Пример: при 8 ксенах и 4 марах ксены МОГУТ хиджакнуть, чтобы понять сколько маров надо чтобы ксены НЕ МОГЛИ хиджакнуть то в конце рассчёта прибавляйте 1"
  - balance: "На картах увеличено количество не разрушаемых камней в скалах"
  - balance: "Рава - увеличил продление эндюра за удары в рейдже (1 > 2 сек), уменьшил треб. плазму на бессмертие 666 > 400, увеличил максимальный достигаемый урон 40 > 45"
  - balance: "Пироген - уменьшил урон огня в тик 10 > 8"
  - balance: "Бегемот - Теперь на дальней клетке при падении камня и геокраше в дополнение к притягиванию также наноситься x0.5 урона от геокраша (7-9 урона в зависимости от брони), немного увеличил урон от разбега и геокраша"
  - balance: "Кинг - снижена броня от взрывов 100 > 90 и огня 100 > 70"
  - balance: "Снижена стоимость прицелов б11/б15 150 > 100"
  - balance: "Лодаут сюрва переделан под тот, который был у КЛФ (сюрв всё ещё дружественный к марам)"
  - balance: "Сюрв получает +1 слот за каждых 4 раундстарт ксено, вместо 6"
  - balance: "Снизил цену на сульфу в карго и вендорах медика, фк. (карго 250 > 175, медик 10 > 7 фк 10 > 6)"
  - balance: "Буллу и Варриору поднято хп на 25 (325 > 350 и 350 > 375 соотв.)"
  - balance: "Спайдерлингам вдовы вернул старые значения хп (150 > 175)"
  - bugfix: "Исправил неверное отображение больших значений стоимости в заказах карго"
  - bugfix: "Варриору исправил, что пропадала возможность бегать при примо. А ещё убрал у его стрейна enpower, т.к абилок у него нет которые бы усилялись"
  - bugfix: "Танк более корректно уничтожает траву"
  - bugfix: "Исправил (убрал) возможность взять сюрва после начала игры"
  - bugfix: "Исправление тада в какой это уже раз?"
  - bugfix: "Исправлено то, что если у тебя не выбрано окно каса то не менялось направление стрейфа"
  - bugfix: "Исправлено неверное наименование отряда у водолазки чарли (charile > charlie)"
  - bugfix: "Исправлен баг, который позволял складывать в шлем вещи большего размера"
  - bugfix: "Исправил, что не отображались повреждения у ксен, когда они стоят на технике"
  - bugfix: "Исправлено, что у скина пони на квину была анимация, даже когда она не двигалась"
  - rscdel: "Удалена возможность выбрать себе плохое зрение в префах"
  - rscdel: "Из сезонки Remote Weapons удалён МЛРС"