author: GOLAj100
changes:
  - rscadd: "Универсальные сменные приклады для автоматов: лёгкий складной приклад, средний, средне-тяжёлый и тяжёлый. Подходят к AR-18, AR-12, AR-21 и MG-42, продаются в автоматных вендингах."
  - rscdel: "Убраны приклады, жёстко привязанные к конкретному стволу (AR-18, AR-12 и MG-42) - вместо них теперь используются универсальные приклады."
  - imageadd: "AR-18, AR-12 и MG-42 переведены на 64-пиксельные спрайты."
