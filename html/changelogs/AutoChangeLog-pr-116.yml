author: "Pak2024"
delete-after: True
changes:
  - rscadd: "Вернул рестрикты на профы по часам"
  - rscadd: "Теперь при старте раунда всех маров в отрядах, где нет СЛов будет прикомандировывать к отряду с СЛом или назначать такого из имеющихся маров/инжей/корпсов/смартов"
  - rscadd: "Теперь если в улье нет т4, то т3 (в приоритете слева направо вроде) становится правителем хайва и получает доступ к меню блессингов и может выдавать лидерки, также может давать анонсы и метки миньонам ставить"
  - balance: "Небольшие изменения кантрбэрри"
  - balance: "Удалена консоль исследователя с краша, цена на неё снижена 300 > 200"
  - balance: "Кд на гор чардж булла 8 > 6 сек"
  - balance: "Кд броска хаггера Керриера 3 > 2 сек. Мили урон керриера 20 > 22. Кд на спавн хаггеров 8 > 5 сек"
  - balance: "Кукловод теперь не тратит плазму на спавн кукл, кд на них уменьшено 25 > 20 сек, добавлено 3 заряда по аналогии с вдовой. Создание кукл происходит быстрее 8 > 5 сек. Броня кукл повышена базово: Мили 14 > 25 Буллет 3 > 10 Лазер 5 > 10 Энергия 3 > 10. Но снижены модификаторы после прокачки. Теперь прост прибавляется 15 ко всему этому. (25+15 = 40 и т.д). Здоровье кукл снижено 250 > 225. Куклы пупитера, если пупитер умирает или эволвает/дээволвает и т.д, постепенно умирают после него. По аналогии с вдовой."
  - balance: "Пироген: Убрана задержка каста на фаерболл у пирогена, необх. плазма снижена 300 > 200. Броня от огня у маров снижена на 10 (у всех видов брони и т.д). Урон от прямого попадания фаерболла снижен 30 > 20. Снижен урон от стаков чарджа или как там эта абилка называется я не ебу 5 > 3"
  - balance: "Убрана задержка каста на фаерболл у пирогена, необх. плазма снижена 300 > 200"
  - balance: "Броня от огня у маров снижена на 10 (у всех видов брони и т.д)"
  - balance: "Шрика: повышено хп 400 > 450. Повышена скорость 0.6 > 0.7 (+ 0,2 на траве). Повышен урон 23 > 24"
  - balance: "Повысил урон, который получают паучата/куклы, если находятся далеко от родителя у паучат 25 > 75. У кукл 100."
  - balance: "Вдова: Спавн паучков вдовы занимает больше времени 0.5 > 1.5 сек. Удалена способность на спавн хаггера."
  - balance: "Хантер: Снижен шанс на иллюзии от обычных атак 70 > 40. АП убрано"
  - balance: "Химера: Добавлена способность хантера на иллюзии от обычных аттак, шанс 50%. Добавлена способность, которая позволяет химере входить в инвиз на 15 секунд. Двигаться при этом можно свободно, это не тратит плазму, но атака или 50 урона по вам или юз способностей раскрывают инвиз. Кд 8 секунд. Плазмы надо 25. АП снижено 10 > 5"
  - balance: "Битл: Снижена скорость в защитной стойке на 0.6. Стан от чарджа битла уменьшен 4 > 3 сек. Немного поменял спрайты, думаю так правильнее будет смотреться"
  - balance: "Варлок: Добавлены феры"
  - bugfix: "Исправлен баг, из за которого после снятия бёрст модуля, если на оружии изначально был режим автобёрстов, то он пропадал"
  - bugfix: "Слой камы перенесёт под слой плащей. Короче говоря камы и кильты теперь будут ПОД плащами, а не наоборот"
  - bugfix: "Исправлен баг, из за которого не отображались прокачки у миньонов пупитера"
  - bugfix: "Исправлен баг, из за которого админы не могли выбрать себе цвет ника в OOC"