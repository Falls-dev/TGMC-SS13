author: "Pak2024"
delete-after: True
changes:
  - rscadd: "На румбу теперь можно крепить клеймор, а с ЕОРД румбой можно играть в рулетку (если кликать на него в харме, то либо он удалится, либо \"удалитесь\" вы)"
  - rscadd: "Синту добавлена возможность кидать газовые гранаты. Т-газ, скрывающий газ, анти газ и гранаты с колючкой."
  - rscadd: "Слоты на сюрвов теперь скейляться, за каждые 6 ксено +1 слот (1 слот всегда есть раундстарт, если будет раундстарт 6 ксено, то будет 2 слота сюрвов соотвественно)"
  - balance: "Мары светятся, если горят, ксенам тоже чуть повышен радиус свечения от горения"
  - balance: "Повышено в стоимости т4 примо 800 > 1000"
  - balance: "Бегемоту повышено хп 450 > 500"
  - balance: "Абилки бегемота теперь целят в рандомную конечность, а не выбранную"
  - balance: "Бафф G огня. Он накладывает больше стаков 2 > 3 и также накладываются стаки при попадании насадками огнемёта по ксено. Чуть дольше горит."
  - bugfix: "Исправлен баг, из-за которого абилки бегемота не учитывали броню"
  - bugfix: "Исправлен баг, из-за которого при падении камня, если марин стоит ровно снизу от него на расстоянии 2 тайлов, то его всё равно дамажило, причём x2 уроном"
  - bugfix: "Возможные исправления тада/подов"
  - bugfix: "Удалил лишний пиксель у вали рапиры"
  - bugfix: "Исправлена ​​вставка HTML-кода с использованием бумажек"
  - image: "Эффекты огня должны стать объёмнее и приятнее."