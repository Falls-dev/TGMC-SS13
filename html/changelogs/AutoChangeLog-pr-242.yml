author: "SanecMan"
delete-after: True
changes:
  - code_imp: "Огонь теперь выпускает вдвое меньше эффектов"
  - code_imp: "Камеры на наушниках больше не насилуют тикер каждый шаг"
  - code_imp: "Перемещение по вентам больше не перерисовывает все трубы каждый шаг"
  - code_imp: "Стволы без перегрева больше не забивают очередь охлаждения"
  - code_imp: "Закрытые контейнеры (рюкзак, модули, каски...) больше не рисуются"
  - bugfix: "При смерти моба под ИИ он больше не пытается искать пути"
  - bugfix: "Призраки больше не копятся в списках радиочатика"
  - bugfix: "Автоогонь больше не пытается стрелять из удалённого ствола и чистит за собой очередь"
  - bugfix: "После переподключения ксенос в вентиляции снова видит трубы"
  - bugfix: "Рантаймы при удалении (гибе) игрока когда над головой у него рунчат"
  - bugfix: "Мед каталка не ломает шаттл при полёте"