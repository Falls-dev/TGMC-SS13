<!doctype html>
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="utf-8" />

    <script type="text/javascript">
      const INDEXED_DB_VERSION = 1;
      const INDEXED_DB_NAME = 'tgmc';
      const INDEXED_DB_STORE_NAME = 'storage';

      const READ_ONLY = 'readonly';
      const READ_WRITE = 'readwrite';

      const MAX_MESSAGES = 1000;

      const dbPromise = (async () => {
        if (document.requestStorageAccess) {
          try {
            const hasAccess = await document.hasStorageAccess();
            if (!hasAccess) {
              await document.requestStorageAccess({ all: true });
            }
          } catch {}
        }

        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persist().catch(() => {});
        }

        return new Promise((resolve, reject) => {
          const req = indexedDB.open(INDEXED_DB_NAME, INDEXED_DB_VERSION);
          req.onupgradeneeded = (event) => {
            try {
              if (event.oldVersion < 1) {
                req.result.createObjectStore(INDEXED_DB_STORE_NAME);
              }
            } catch (err) {
              reject(new Error('Failed to upgrade IDB: ' + req.error));
            }
          };

          req.onsuccess = () => resolve(req.result);

          req.onerror = () => {
            reject(new Error('Failed to open IDB: ' + req.error));
          };
        });
      })();

      window.addEventListener('message', (messageEvent) => {
        if (
          window.parent === window ||
          messageEvent.source !== window.parent ||
          !messageEvent.data
        ) {
          return;
        }
        const { type, key, value } = messageEvent.data;
        // BYOND windows can have an opaque origin.
        const targetOrigin =
          messageEvent.origin === 'null' ? '*' : messageEvent.origin;
        switch (type) {
          case 'ping':
            messageEvent.source.postMessage(true, targetOrigin);
            break;
          case 'get':
            if (typeof key === 'string') {
              get(key).then((value) => {
                messageEvent.source.postMessage({ key, value }, targetOrigin);
              });
            }
            break;
          case 'set':
            if (typeof key === 'string') {
              set(key, value);
            }
            break;
          case 'remove':
            if (typeof key === 'string') {
              remove(key);
            }
            break;
          case 'clear':
            clear();
            break;

          default:
            break;
        }
      });

      const getStore = async (mode) => {
        return dbPromise.then((db) =>
          db
            .transaction(INDEXED_DB_STORE_NAME, mode)
            .objectStore(INDEXED_DB_STORE_NAME),
        );
      };

      const get = async (key) => {
        const store = await getStore(READ_ONLY);
        return new Promise((resolve, reject) => {
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      };

      const set = async (key, value) => {
        const store = await getStore(READ_WRITE);
        store.put(value, key);
      };

      const remove = async (key) => {
        const store = await getStore(READ_WRITE);
        store.delete(key);
      };

      const clear = async () => {
        const store = await getStore(READ_WRITE);
        store.clear();
      };

      dbPromise.then(() => {
        window.parent.postMessage('ready', '*');
      });
    </script>
  </head>
</html>
