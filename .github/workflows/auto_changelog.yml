# Creates html/changelogs/AutoChangeLog-pr-N.yml from a merged PR's :cl: block,
# and posts the same changelog to Discord (secret CHANGELOG_DISCORD_HOOK).
name: Auto Changelog
on:
  pull_request_target:
    types:
      - closed
    branches:
      - master
permissions:
  contents: write
jobs:
  auto_changelog:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run auto changelog + Discord
        uses: actions/github-script@v7
        env:
          CHANGELOG_DISCORD_HOOK: ${{ secrets.CHANGELOG_DISCORD_HOOK }}
        with:
          script: |
            const { processAutoChangelog } = await import('${{ github.workspace }}/tools/pull_request_hooks/autoChangelog.js')
            await processAutoChangelog({ github, context })
          github-token: ${{ secrets.GITHUB_TOKEN }}
