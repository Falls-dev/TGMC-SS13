name: Compile changelogs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  # When Auto Changelog commits pending YAML after a merge, post to Discord and archive.
  push:
    branches:
      - master
    paths:
      - "html/changelogs/*.yml"

jobs:
  compile:
    name: "Compile changelogs"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: "Check for ACTION_ENABLER secret and pass true to output if it exists to be checked by later steps"
        id: value_holder
        env:
          ENABLER_SECRET: ${{ secrets.GITHUB_TOKEN }}
        run: |
          unset SECRET_EXISTS
          if [ -n "$ENABLER_SECRET" ]; then SECRET_EXISTS=true ; fi
          echo "ACTIONS_ENABLED=$SECRET_EXISTS" >> $GITHUB_OUTPUT

      - name: "Setup python"
        if: steps.value_holder.outputs.ACTIONS_ENABLED
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: "Install deps"
        if: steps.value_holder.outputs.ACTIONS_ENABLED
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements-changelog.txt
          sudo apt-get install -y dos2unix

      - name: "Checkout"
        if: steps.value_holder.outputs.ACTIONS_ENABLED
        uses: actions/checkout@v4
        with:
          fetch-depth: 25
          persist-credentials: false

      - name: "Post pending changelogs to Discord"
        if: steps.value_holder.outputs.ACTIONS_ENABLED
        continue-on-error: true
        env:
          CHANGELOG_DISCORD_HOOK: ${{ secrets.CHANGELOG_DISCORD_HOOK }}
        run: |
          if [ -z "$CHANGELOG_DISCORD_HOOK" ]; then
            echo "CHANGELOG_DISCORD_HOOK secret empty; skipping Discord post."
            exit 0
          fi
          pending="$(find html/changelogs -maxdepth 1 -type f -name '*.yml' ! -name 'example.yml' | wc -l)"
          echo "Pending changelog YAML files: $pending"
          python tools/ss13_discord_changelog.py html/changelogs --webhook "$CHANGELOG_DISCORD_HOOK"

      - name: "Compile"
        if: steps.value_holder.outputs.ACTIONS_ENABLED
        run: |
          python tools/ss13_genchangelog.py html/changelogs

      - name: Commit
        if: steps.value_holder.outputs.ACTIONS_ENABLED
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Changelogs"
          git pull origin master || true
          git add html/changelogs
          git commit -m "Automatic changelog compile [ci skip]" -a || true

      - name: "Push"
        if: steps.value_holder.outputs.ACTIONS_ENABLED
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
